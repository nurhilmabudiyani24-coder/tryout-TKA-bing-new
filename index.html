{t:'Text 1 · Narrative',s:'Narrative 1',h:'The Elephant and the Little Bird',b:`Once upon a time, in a green forest, there lived a big elephant named Gaja. Every morning, he walked to the lake to drink water and take a bath.
One morning, a little bird named Kiki was singing happily on a branch above the lake. Gaja was tired and wanted to rest, but Kiki's song was loud. He became angry and shook the tree. Kiki's nest fell into the water.
"Please forgive me!" cried Kiki. "I only wanted to sing. If you forgive me, I promise I will help you one day."
Gaja laughed. "A tiny bird cannot help a big elephant." But he felt sorry for her, so he lifted the nest out of the water with his trunk and put it back on the branch.
A few weeks later, Gaja was walking near the hills when he fell into a deep, muddy hole. He pulled and pushed, but the mud was too thick. He trumpeted loudly, but nobody heard him.
Kiki heard the sound and flew over. She saw Gaja stuck in the mud. "Don't worry, I will find help!" she said. She flew quickly to the herd and sang loudly until the other elephants followed her. Together, they pulled Gaja out of the hole with their trunks.
Gaja looked at Kiki and said, "Thank you. I was wrong to laugh at you." Kiki smiled. From that day, the elephant and the little bird became good friends. Gaja learned that no one is too small to help, and that kindness always comes back.`},
{t:'Text 2 · Procedure (Infographic)',s:'Procedure',h:'Easy Ways to Stay Healthy at School',b:`1. **Wash Your Hands:** Use soap before eating and after using the toilet.
2. **Drink Enough Water:** Bring a water bottle and drink 6–8 glasses a day.
3. **Eat Balanced Meals:** Include fruit, vegetables, and protein in your meals.
4. **Move Your Body:** Exercise for at least 30 minutes every day.
5. **Sleep Well:** Aim for 8–9 hours of sleep every night.
6. **Keep Your Bag Light:** Carry only the books you need to protect your back.
7. **Sit Straight:** Keep a good posture when you study.
8. **Take Screen Breaks:** Rest your eyes for a few minutes every 20 minutes.
9. **Talk to Someone:** Share your feelings with friends, family, or teachers.
10. **Stay Home When Sick:** Rest well and avoid spreading germs to others.`},
{t:'Text 3 · Narrative',s:'Narrative 2',h:'The Parrot Who Wanted to Roar',b:`In a big jungle lived a strong lion named Leo and a small, colorful parrot named Pipo. All the animals respected Leo because he was brave and had a deep, powerful roar. Pipo was not strong, but he could copy any sound he heard.
Pipo wanted to be like Leo, so he often practiced Leo's roar. But his roar came out high and funny, and the animals laughed. One day, the monkeys heard him at the river. They laughed so hard that they fell from the tree. Pipo felt sad. "I wish I were as brave as Leo," he said quietly.
Leo came near and asked, "Why are you sad, Pipo?" After hearing the story, Leo smiled. "You don't have to roar like me. You have your own gift. You can copy any sound, and one day it will be useful."
That evening, some hunters came near the jungle while Leo was away in the hills. The animals were afraid. Pipo thought for a moment, then hid behind a big rock. He remembered all the times he had listened to Leo. He took a deep breath and practiced the roar again and again until it sounded deep and strong. The hunters heard it and thought a real lion was near. They ran away as fast as they could.
When Leo returned, the animals told him everything. "Thank you, Pipo," said Leo. "Your gift saved us all." From that day, the animals never laughed at Pipo again. Pipo was proud of himself, and he and Leo became good friends. They learned that everyone has a special talent.`},
{t:'Text 4 · Descriptive',s:'Descriptive',h:'Mount Bromo',b:`Mount Bromo is one of the most famous volcanoes in Indonesia. It is located in East Java, in the Bromo Tengger Semeru National Park. The mountain is about 2,329 meters high and is still active.
Around the volcano, there is a wide area of gray sand called the Sea of Sand. In the early morning, visitors drive jeeps or ride horses across it. Many tourists also climb Mount Penanjakan to watch the sunrise. When the sun rises, the sky turns orange, pink, and gold. Thin white clouds lie over the valley like a soft blanket.
The Tengger people live around the mountain. They believe that the volcano is sacred, and every year they hold the Yadnya Kasada ceremony. During the ceremony, they throw fruits, vegetables, and flowers into the crater as offerings.
The cool air and beautiful views make Bromo a special place to visit. However, visitors must always respect nature and the local culture.`},
{t:'Text 5 · Analytical Exposition',s:'Analytical Exp.',h:'Why Students Should Read Books Every Day',b:`Many students today spend their free time on phones and games. However, reading books every day is a habit that brings many benefits. Students who read regularly can do better at school and in life.
First, reading improves vocabulary and language skills. When students read, they learn new words and see how sentences are built. This helps them write and speak more clearly.
Second, reading helps students focus. Unlike short videos, a book needs students to pay attention for a longer time. Over time, they can concentrate better when studying.
Third, reading reduces stress. Reading quietly for fifteen to twenty minutes before bed can help students relax and sleep better.
Finally, reading gives students knowledge about the world, from history to science, which makes class discussions easier.
In conclusion, students should read books every day because it builds language skills, improves focus, lowers stress, and expands knowledge. Schools and families should support this habit.
**Table 1. How do students read?**`,tb:[['Category','Percentage','Notes'],['Students who read books daily','30%','At least 15 minutes a day'],['Students who read only for school assignments','40%','Rarely read for fun'],['Students who own a library card','20%','Can borrow books for free'],['Students who read before bed','25%','Often report better sleep'],['Students who spend most free time on phones','55%','Mainly social media and games'],['Students who read in two languages','15%','Often have a wider vocabulary']]}];

const ld=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}},sv=a=>{try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}};
const dt=t=>new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const pred=s=>s>=85?'Sangat Baik':s>=70?'Baik':s>=55?'Cukup':'Perlu Latihan';
const hasA=i=>{const a=S.ans[i];return a!=null&&(Array.isArray(a)?a.some(x=>x!=null):true)&&(!Array.isArray(a)||a.length>0)};
const okA=(a,i)=>{const q=Q[i];if(a==null)return false;if(q[1]=='s')return a===q[4];if(q[1]=='m')return [...a].sort().join()==q[4].join();return q[4].every((v,r)=>a[r]===v)};
const foot=`<footer class="np">Dikembangkan oleh <b>Nur Hilma Budiyani, M.Pd</b> · SMAN 2 Kalianda</footer>`;
function R(){const a=$('#app');a.innerHTML=({home,quiz,res,cert,hist})[S.v]()+foot;}
function home(){const f=S.f;return `<section class="hero"><span class="bdg">Try Out TKA Berbasis Komputer</span><h1>Pendalaman TKA Bahasa Inggris</h1><p>25 soal · 50 menit · pembahasan lengkap di akhir</p></section>
<div class="cd"><h2>Data Peserta</h2><div class="fg"><label>Nama Siswa<input value="${esc(f.n)}" oninput="S.f.n=this.value" autocomplete="off"></label><label>Kelas<input value="${esc(f.k)}" oninput="S.f.k=this.value" placeholder="contoh: XII IPA 1"></label><label>No. Peserta Didik<input value="${esc(f.p)}" oninput="S.f.p=this.value"></label><label>Asal Sekolah<input value="${esc(f.s)}" oninput="S.f.s=this.value"></label></div></div>
<div class="cd"><h2>Pilih Try Out</h2><div class="to"><button class="tc ${S.to==1?'on':''}" onclick="S.to=1;R()"><b>Try Out 1</b><small>Tersedia · 25 soal Bahasa Inggris (5 jenis teks)</small></button><button class="tc lk" disabled><b>Try Out 2</b><small>Segera hadir</small></button></div>
<div class="row" style="margin-top:14px"><button class="btn big" onclick="start()">Mulai Try Out 1</button><button class="btn g big" onclick="S.v='hist';R()">Riwayat &amp; Progres</button></div><p id="er" class="hint" style="color:var(--no)"></p></div>`}
function start(){const f=S.f;if(!f.n.trim()||!f.k.trim()||!f.s.trim()){$('#er').textContent='Isi nama siswa, kelas, dan asal sekolah terlebih dahulu.';return}S.ans={};S.dub={};S.i=0;S.md=0;S.end=Date.now()+DUR*1000;S.v='quiz';clearInterval(TI);TI=setInterval(tick,1000);R();scrollTo(0,0)}
function tick(){const l=Math.max(0,Math.ceil((S.end-Date.now())/1000)),e=$('#tm');if(e){e.textContent=String(Math.floor(l/60)).padStart(2,'0')+':'+String(l%60).padStart(2,'0');e.className='tm'+(l<300?' lo':'')}if(l<=0)finish()}
function quiz(){const i=S.i,q=Q[i],t=T[q[0]],f=S.f;
const ps=t.b.split('\n').map(p=>`<p>${fm(p)}</p>`).join('')+(t.tb?`<div style="overflow:auto"><table>${t.tb.map((r,k)=>`<tr>${r.map(c=>k?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</table></div>`:'');
let body='';
if(q[1]=='c')body=`<div style="overflow:auto"><table><tr><th>Statement</th>${q[3].c.map(c=>`<th>${c}</th>`).join('')}</tr>${q[3].r.map((r,k)=>`<tr><td>${esc(r)}</td>${q[3].c.map((c,v)=>`<td class="pk" onclick="setC(${k},${v})">${(S.ans[i]||[])[k]===v?'🔘':'⚪'}</td>`).join('')}</tr>`).join('')}</table></div>`;
else body=q[3].map((o,k)=>{const on=q[1]=='s'?S.ans[i]===k:(S.ans[i]||[]).includes(k);return `<button class="op ${on?'on':''}" onclick="pick(${k})"><i>${q[1]=='s'?String.fromCharCode(65+k):(on?'☑':'☐')}</i><span>${fm(o)}</span></button>`}).join('');
const nav=Array.from({length:N},(_,k)=>`<button class="n ${S.dub[k]?'r':hasA(k)?'a':''} ${k==i?'cur':''}" onclick="go(${k})">${k+1}</button>`).join('');
const na=Object.keys(S.ans).filter(k=>hasA(+k)).length,nd=Object.values(S.dub).filter(Boolean).length;
return `<div class="top np"><div><b>${esc(f.n)}</b><small>${esc(f.k)} · ${esc(f.s)}</small></div><div class="tm" id="tm">--:--</div></div>
<div class="qz"><div><div class="cd"><span class="tag">${t.t}</span><h3>${t.h}</h3><div class="ps">${ps}</div></div>
<div class="cd"><div class="row sp"><b>Soal ${i+1} dari ${N}</b><span class="hint">${q[1]=='m'?'Pilih semua jawaban yang benar':q[1]=='c'?'Pilih satu kolom di setiap baris':'Pilih satu jawaban'}</span></div><p style="font-weight:700">${fm(q[2])}</p>${body}
<div class="row sp" style="margin-top:14px"><button class="btn g" onclick="go(${i-1})" ${i?'':'disabled'}>◀ Sebelumnya</button><button class="btn w" onclick="S.dub[${i}]=!S.dub[${i}];R()">${S.dub[i]?'✔ Ragu-ragu':'Ragu-ragu'}</button>${i<N-1?`<button class="btn" onclick="go(${i+1})">Selanjutnya ▶</button>`:`<button class="btn ok" onclick="S.md=1;R()">Selesai</button>`}</div></div></div>
<div class="cd" style="margin-top:14px"><h2>Navigasi Soal</h2><div class="ng">${nav}</div><div class="lg"><span style="--c:var(--ok)">Dijawab (${na})</span><span style="--c:var(--wa)">Ragu-ragu (${nd})</span><span style="--c:var(--gr)">Belum (${N-na})</span></div><button class="btn ok" style="width:100%;margin-top:12px" onclick="S.md=1;R()">Selesai &amp; Kumpulkan</button></div></div>
${S.md?`<div class="md"><div><h2>Kumpulkan jawaban?</h2><p>Dijawab: <b>${na}</b> · Ragu-ragu: <b>${nd}</b> · Belum dijawab: <b>${N-na}</b></p><div class="row"><button class="btn g" onclick="S.md=0;R()">Kembali</button><button class="btn ok" onclick="finish()">Ya, kumpulkan</button></div></div></div>`:''}`}
function go(k){if(k<0||k>=N)return;S.i=k;R();scrollTo(0,0);tick()}
function pick(k){const i=S.i;if(Q[i][1]=='s')S.ans[i]=k;else{const a=S.ans[i]||[];S.ans[i]=a.includes(k)?a.filter(x=>x!=k):[...a,k]}R();tick()}
function setC(r,v){const i=S.i,a=[...(S.ans[i]||[])];a[r]=v;S.ans[i]=a;R();tick()}
function finish(){clearInterval(TI);let per=[0,0,0,0,0],b=0,k=0;Q.forEach((q,i)=>{if(okA(S.ans[i],i)){per[q[0]]++;b++}if(!hasA(i))k++});
const at={id:Date.now(),n:S.f.n.trim(),k:S.f.k.trim(),p:S.f.p.trim(),s:S.f.s.trim(),to:1,score:Math.round(b/N*100),b,z:N-b-k,k,per,ans:S.ans,d:Math.min(DUR,DUR-Math.max(0,Math.ceil((S.end-Date.now())/1000)))};
const h=ld();h.push({...at,ans:undefined});sv(h);S.cur=at;S.md=0;S.v='res';R();scrollTo(0,0)}
function res(){const a=S.cur;return `<section class="hero"><span class="bdg">Hasil Try Out ${a.to}</span><h1>Nilai Akhir</h1></section>
<div class="cd row" style="gap:24px"><div class="sc" style="--v:${a.score}"><span>${a.score}</span></div><div><h2 style="margin:0">${esc(a.n)}</h2><div class="hint">Kelas ${esc(a.k)}${a.p?' · No. Peserta '+esc(a.p):''}<br>Asal sekolah: ${esc(a.s)}</div><p><b>${pred(a.score)}</b></p><div class="st"><div><b style="color:var(--ok)">${a.b}</b>Benar</div><div><b style="color:var(--no)">${a.z}</b>Salah</div><div><b>${a.k}</b>Kosong</div></div></div></div>
<div class="cd"><h2>Rincian per Jenis Teks</h2>${T.map((t,k)=>`<div class="row sp" style="margin-top:8px"><span>${t.s}</span><b>${a.per[k]}/5</b></div><div class="bar"><i style="width:${a.per[k]*20}%"></i></div>`).join('')}
<div class="row np" style="margin-top:14px"><button class="btn" onclick="S.v='cert';R()">🏅 Lihat Sertifikat</button><button class="btn g" onclick="S.v='hist';R()">📈 Progres</button><button class="btn g" onclick="S.v='home';R()">Beranda</button></div></div>
${[].map((q,i)=>{const u=a.ans[i],ok=okA(u,i);let o='';
if(q[1]=='c')o=`<table><tr><th>Statement</th><th>Kunci</th><th>Jawabanmu</th></tr>${q[3].r.map((r,k)=>`<tr><td>${esc(r)}</td><td>${q[3].c[q[4][k]]}</td><td style="color:${u&&u[k]===q[4][k]?'var(--ok)':'var(--no)'}">${u&&u[k]!=null?q[3].c[u[k]]:'—'}</td></tr>`).join('')}</table>`;
else{const ks=[].concat(q[4]),us=u==null?[]:[].concat(u);o=q[3].map((x,k)=>`<div class="op ${ks.includes(k)?'ck':us.includes(k)?'bad':''}"><i>${q[1]=='s'?String.fromCharCode(65+k):(ks.includes(k)?'✔':us.includes(k)?'✖':'☐')}</i><span>${fm(x)}</span></div>`).join('')}
return `<div class="cd"><div class="row sp"><span class="tag">Soal ${i+1} · ${T[q[0]].s}</span><span class="mk" style="background:${ok?'var(--ok)':hasAns(u)?'var(--no)':'var(--mu)'}">${ok?'Benar':hasAns(u)?'Salah':'Kosong'}</span></div><p style="font-weight:700">${fm(q[2])}</p>${o}<div class="ex"><b>Pembahasan:</b> ${q[5]}</div></div>`}).join('')}`}
const hasAns=u=>u!=null&&(!Array.isArray(u)||u.some(x=>x!=null)&&u.length>0);
function hist(){const h=ld().sort((a,b)=>a.id-b.id),l=h.slice(-10);
if(!h.length)return `<section class="hero"><h1>Riwayat &amp; Progres</h1></section><div class="cd"><p>Belum ada hasil Try Out di perangkat ini. Kerjakan Try Out 1 untuk mulai melihat progres.</p><button class="btn" onclick="S.v='home';R()">Mulai Try Out</button></div>`;
const best=Math.max(...h.map(x=>x.score)),delta=h.length>1?h[h.length-1].score-h[h.length-2].score:null;
return `<section class="hero"><span class="bdg">Progres Belajar</span><h1>Riwayat &amp; Progres</h1><p>${h.length} percobaan · nilai tertinggi ${best}${delta!=null?` · perubahan terakhir ${delta>=0?'+':''}${delta}`:''}</p></section>
<div class="cd"><h2>Grafik Nilai (10 terakhir)</h2><div class="ch">${l.map(x=>`<div style="height:${Math.max(4,x.score)}%"><b>${x.score}</b></div>`).join('')}</div></div>
<div class="cd" style="overflow:auto"><h2>Rincian Setiap Try Out</h2><table><tr><th>Tanggal</th><th>Nama</th><th>TO</th><th>Nilai</th><th>B/S/K</th><th>Sertifikat</th></tr>${[...h].reverse().map(x=>`<tr><td>${dt(x.id)}</td><td>${esc(x.n)}</td><td>${x.to}</td><td><b>${x.score}</b> (${pred(x.score)})</td><td>${x.b}/${x.z}/${x.k}</td><td><button class="btn g" onclick="S.cur=ld().find(y=>y.id==${x.id});S.v='cert';R()">Lihat</button></td></tr>`).join('')}</table></div>
<div class="row np"><button class="btn" onclick="S.v='home';R()">Beranda</button><button class="btn g" onclick="if(confirm('Hapus semua riwayat?')){sv([]);R()}">Hapus Riwayat</button></div>`}
function cert(){const a=S.cur,h=ld().filter(x=>x.n==a.n).sort((x,y)=>x.id-y.id),ix=h.findIndex(x=>x.id==a.id),pv=ix>0?h[ix-1]:null;
return `<div class="cert"><div class="bdg" style="background:var(--pr)">🏅 Sertifikat Hasil Try Out</div><h1>Pendalaman TKA Bahasa Inggris</h1><p>Diberikan kepada</p><div class="nm">${esc(a.n)}</div><p>Kelas ${esc(a.k)}${a.p?' · No. Peserta '+esc(a.p):''}<br>${esc(a.s)}</p><p>telah menyelesaikan <b>Try Out ${a.to}</b> pada ${dt(a.id)} dengan nilai akhir</p><div style="font:800 54px Georgia,serif;color:var(--pr)">${a.score}</div><b>${pred(a.score)}</b>
<div style="text-align:left;margin-top:14px"><h2>Rincian Hasil</h2><p class="hint">Benar ${a.b} · Salah ${a.z} · Kosong ${a.k} · Waktu ${Math.floor(a.d/60)} menit</p>${T.map((t,k)=>`<div class="row sp"><span>${t.s}</span><b>${a.per[k]}/5</b></div><div class="bar"><i style="width:${a.per[k]*20}%"></i></div>`).join('')}
<h2 style="margin-top:14px">Progres</h2><p>${pv?`Nilai sebelumnya ${pv.score} → sekarang ${a.score} (<b>${a.score-pv.score>=0?'+':''}${a.score-pv.score}</b>).`:'Ini percobaan pertamamu pada Try Out ini.'} Total percobaan: ${h.length}.</p>
<div class="ch">${h.slice(-8).map(x=>`<div style="height:${Math.max(4,x.score)}%;${x.id==a.id?'':'opacity:.55'}"><b>${x.score}</b></div>`).join('')}</div></div>
<p style="margin-top:20px" class="hint">Pengembang: <b>Nur Hilma Budiyani, M.Pd</b> · SMAN 2 Kalianda</p></div>
<div class="row np" style="margin-top:14px"><button class="btn" onclick="print()">🖨 Cetak / Simpan PDF</button><button class="btn g" onclick="S.v='hist';R()">Riwayat</button><button class="btn g" onclick="S.v='home';R()">Beranda</button></div>`}
R();
</script></body></html>
